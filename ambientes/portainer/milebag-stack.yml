# Stack do Milebag para o Portainer: só imagens prontas (nenhum código-fonte vai para o servidor) e nenhuma pasta
# montada. Gerada junto com as imagens por scripts/empacotar-portainer.sh; os valores vêm do milebag.env do pacote
# (Portainer: Stacks > Add stack > Upload, e "Load variables from .env file").
#
# O HTTPS fica com o proxy do servidor (ex.: Nginx Proxy Manager), que encaminha o domínio para a porta
# MILEBAG_PORTA_HTTP; o Caddy daqui atende só HTTP e encaminha /api para a API.
# Mantenha as variáveis da API em sincronia com ambientes/docker-compose.yml.

services:
  postgres:
    image: milebag/postgres:16
    pull_policy: never
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: ${MILEBAG_PG_ADMIN_SENHA:?defina MILEBAG_PG_ADMIN_SENHA}
      MILEBAG_APP_SENHA: ${MILEBAG_PG_APP_SENHA:?defina MILEBAG_PG_APP_SENHA}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d milebag"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  valhalla:
    image: milebag/valhalla:${MILEBAG_TAG_VALHALLA:?defina MILEBAG_TAG_VALHALLA}
    pull_policy: never
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8002/status || exit 1"]
      interval: 15s
      retries: 40
      start_period: 60s
    restart: unless-stopped

  api:
    image: milebag/api:${MILEBAG_TAG:?defina MILEBAG_TAG}
    pull_policy: never
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      MILEBAG_DB_URL: jdbc:postgresql://postgres:5432/milebag
      MILEBAG_DB_USER: milebag_app
      MILEBAG_DB_PASSWORD: ${MILEBAG_PG_APP_SENHA}
      MILEBAG_FLYWAY_USER: admin
      MILEBAG_FLYWAY_PASSWORD: ${MILEBAG_PG_ADMIN_SENHA}
      MILEBAG_JWT_SECRET: ${MILEBAG_JWT_SECRET:?defina MILEBAG_JWT_SECRET}
      MILEBAG_CORS_ALLOWED_ORIGINS: ${MILEBAG_URL_PUBLICA:?defina MILEBAG_URL_PUBLICA}
      MILEBAG_CONVITE_URL_BASE: ${MILEBAG_URL_PUBLICA}
      MILEBAG_STORAGE_DIR: /dados/storage
      MILEBAG_VALHALLA_URL: http://valhalla:8002
      MILEBAG_NOMINATIM_USER_AGENT: ${MILEBAG_NOMINATIM_USER_AGENT:-milebag-api}
      MILEBAG_DEV_SEED_USUARIOS: "false"
      SPRINGDOC_API_DOCS_ENABLED: "false"
      SPRINGDOC_SWAGGER_UI_ENABLED: "false"
      MILEBAG_TELEGRAM_HABILITADO: ${MILEBAG_TELEGRAM_HABILITADO:-false}
      MILEBAG_TELEGRAM_BOT_TOKEN: ${MILEBAG_TELEGRAM_BOT_TOKEN:-}
      MILEBAG_TELEGRAM_BOT_USERNAME: ${MILEBAG_TELEGRAM_BOT_USERNAME:-}
      MILEBAG_TELEGRAM_WEBHOOK_SECRET: ${MILEBAG_TELEGRAM_WEBHOOK_SECRET:-}
      MILEBAG_TELEGRAM_API_URL: ${MILEBAG_TELEGRAM_API_URL:-https://api.telegram.org}
      MILEBAG_PUSH_CHAVE_PUBLICA: ${MILEBAG_PUSH_CHAVE_PUBLICA:-}
      MILEBAG_PUSH_CHAVE_PRIVADA: ${MILEBAG_PUSH_CHAVE_PRIVADA:-}
      MILEBAG_PUSH_ASSUNTO: ${MILEBAG_PUSH_ASSUNTO:-mailto:noreply@milebag.local}
      MILEBAG_SMTP_HABILITADO: ${MILEBAG_SMTP_HABILITADO:-false}
      MILEBAG_SMTP_HOST: ${MILEBAG_SMTP_HOST:-}
      MILEBAG_SMTP_PORT: ${MILEBAG_SMTP_PORT:-587}
      MILEBAG_SMTP_USUARIO: ${MILEBAG_SMTP_USUARIO:-}
      MILEBAG_SMTP_SENHA: ${MILEBAG_SMTP_SENHA:-}
      MILEBAG_SMTP_REMETENTE: ${MILEBAG_SMTP_REMETENTE:-}
      MILEBAG_IMAP_HABILITADO: ${MILEBAG_IMAP_HABILITADO:-false}
      MILEBAG_IMAP_HOST: ${MILEBAG_IMAP_HOST:-}
      MILEBAG_IMAP_PORT: ${MILEBAG_IMAP_PORT:-993}
      MILEBAG_IMAP_USUARIO: ${MILEBAG_IMAP_USUARIO:-}
      MILEBAG_IMAP_SENHA: ${MILEBAG_IMAP_SENHA:-}
      MILEBAG_MENSAGERIA_IMAP_HABILITADO: ${MILEBAG_MENSAGERIA_IMAP_HABILITADO:-false}
      MILEBAG_MENSAGERIA_IMAP_HOST: ${MILEBAG_MENSAGERIA_IMAP_HOST:-}
      MILEBAG_MENSAGERIA_IMAP_PORT: ${MILEBAG_MENSAGERIA_IMAP_PORT:-993}
      MILEBAG_MENSAGERIA_IMAP_USUARIO: ${MILEBAG_MENSAGERIA_IMAP_USUARIO:-}
      MILEBAG_MENSAGERIA_IMAP_SENHA: ${MILEBAG_MENSAGERIA_IMAP_SENHA:-}
      MILEBAG_MENSAGERIA_DOMINIO_EMAIL: ${MILEBAG_MENSAGERIA_DOMINIO_EMAIL:-mensagens.milebag.local}
      MILEBAG_MENSAGERIA_PREFIXO_ENDERECO: ${MILEBAG_MENSAGERIA_PREFIXO_ENDERECO:-}
      MILEBAG_MENSAGERIA_SMTP_USUARIO: ${MILEBAG_MENSAGERIA_SMTP_USUARIO:-}
      MILEBAG_MENSAGERIA_SMTP_SENHA: ${MILEBAG_MENSAGERIA_SMTP_SENHA:-}
      MILEBAG_MENSAGERIA_SMTP_REMETENTE: ${MILEBAG_MENSAGERIA_SMTP_REMETENTE:-}
      MILEBAG_DEMONSTRACAO_DESTINO: ${MILEBAG_DEMONSTRACAO_DESTINO:-contato@milebag.com.br}
    volumes:
      - storage:/dados/storage
    restart: unless-stopped

  web:
    image: milebag/web:${MILEBAG_TAG}
    pull_policy: never
    depends_on:
      - api
    environment:
      MILEBAG_SITE: ":80"
    ports:
      - "${MILEBAG_PORTA_HTTP:?defina MILEBAG_PORTA_HTTP}:80"
    volumes:
      - caddy-dados:/data
    restart: unless-stopped

volumes:
  pgdata:
  storage:
  caddy-dados:
